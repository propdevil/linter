[workspace]
members = [
    "packages/error",
    "packages/httpio",
    "packages/store",
    "packages/archlint",
    "packages/exch",
    "packages/exch-binance",
    "packages/exch-polymarket",
    "packages/exch-kalshi",
    "packages/exch-opinion",
    "packages/logging",
    "services/markets",
    "services/identity",
    "services/identity/macros",
    "services/registry",
    "services/crm",
    "services/payments",
    "supervisor",
]
resolver = "2"
# design-lint is a standalone dev/CI tool (its own workspace), never built
# into the image or `cargo build --workspace`.
exclude = ["packages/design-lint"]

# Inherited by the Payment-SDK crates, which declare
# `edition.workspace = true`. prop's own crates pin edition 2021 explicitly
# and are unaffected.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

# Only crates opting in with `[lints] workspace = true` are affected — the
# Payment-SDK crates do; prop's own do not.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# ── Crates the SDK pins exactly; kept aligned so one resolution serves both.
#
# These track `Payment-SDK/Cargo.toml`. The alloy line moved from 1.0 to 1.8
# with the SDK's chain rewrite: resolving 1.0 here again would force two
# incompatible copies of `alloy-consensus` into one build.
#
# Only `k256` and `hex` are used by prop's own crates today; the rest exist so
# a single resolution serves prop and the SDK alike.
alloy-primitives = { version = "1", default-features = false, features = ["std"] }
alloy-consensus = { version = "1.8", features = ["k256"] }
alloy-eips = "1.8"
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
k256 = { version = "=0.13.4", features = ["ecdsa", "schnorr"] }
zeroize = "=1.8.2"
futures-executor = "0.3"
hex = "=0.4.3"

# Async
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Errors
anyhow = "1.0"
thiserror = "1.0"

# Serde
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP / WS
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Crypto (kept for exchange place_order paths)
ethers = { version = "2.0", features = ["legacy"] }
hmac = "0.12"
sha2 = "0.10"
# Deposit-address derivation. `ripemd` + `bech32` are what turn a secp256k1
# public key into a real P2WPKH address; without them a stored private key
# would not match its own address.
ripemd = "0.1"
bech32 = "0.11"
rand = "0.8"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
pkcs1 = { version = "0.7", features = ["pem"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }

# Utils
rustc-hash = "2.0"
dotenvy = "0.15"
parking_lot = "0.12"
dashmap = "6.1"
validator = { version = "0.18", features = ["derive"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
rust_decimal = { version = "1.36", features = ["serde-str", "maths"] }
rust_decimal_macros = "1.36"

# DB
diesel = { version = "2.2", features = [
    "postgres",
    "r2d2",
    "chrono",
    "serde_json",
    "uuid",
    "numeric",
] }
diesel-derive-enum = { version = "2.1", features = ["postgres"] }
pgvector = { version = "0.4", features = ["diesel"] }
bigdecimal = { version = "0.4", features = ["serde"] }
num-bigint = "0.4"
tokio-postgres = { version = "0.7", features = [
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }

# Web
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Internal
error      = { path = "packages/error", default-features = false }
httpio     = { path = "packages/httpio" }
store      = { path = "packages/store" }
archlint   = { path = "packages/archlint" }
logging    = { path = "packages/logging" }
supervisor = { path = "supervisor" }
identity   = { path = "services/identity" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
