[package]
name = "design-lint"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
english-pos-tagger = "0.1"
wordnet-lemmatizer = "0.1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
thiserror = "2"
toml = "1"

# Standalone workspace on purpose: design-lint is a dev/CI tool, NOT a
# member of prop's workspace and NOT part of the nix image build (see the
# root Cargo.toml `exclude` + flake.nix source filter). Its NLP deps never
# reach the docker image. Run via `scripts/supervisor task design-lint`.
[workspace]
