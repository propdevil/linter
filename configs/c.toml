[files]
exclude = ["**/.git", "**/target"]

[[rules."c/file-length"]]
target = "**/*.{c,h}"
max_lines = 1500

[[rules."c/function-length"]]
target = "**/*.{c,h}"
max_lines = 200

[[rules."c/nesting"]]
target = "**/*.{c,h}"
max_depth = 6

[[rules."redundant-parent-name"]]
target = "**/src/**/*.{rs,c,h}"
ignored_names = ["mod", "lib", "main", "index"]

[[rules."line-width"]]
target = "**/*.{rs,c,h}"
max_columns = 100
tab_width = 4

[[rules."max-indent"]]
target = "**/*.{rs,c,h}"
max_columns = 16
tab_width = 4


[[rules."c/unchecked-allocation"]]
target = "**/*.{c,h}"
functions = ["malloc", "calloc", "realloc"]

[[rules."c/ignored-result"]]
target = "**/*.{c,h}"
functions = ["fopen", "fdopen", "tmpfile", "realloc"]

[[rules."c/safety-rationale"]]
target = "**/*.{c,h}"
operations = ["gets", "vsprintf"]
