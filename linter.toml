# Generated from the default preset, then configured for this repository.
[files]
exclude = ["**/.git", "**/target", "sources/**"]

[[rules.layout]]
target = "."
mode = "permissive"
files.required = ["Cargo.toml", "Cargo.lock", "linter.toml"]


[[rules.layout]]
target = "apps/*"
mode = "restrictive"
files.required = ["Cargo.toml", "src/main.rs"]
directories.allowed = [{ target = "tests", description = "Crate integration tests." }]

[[rules.layout]]
target = "linter"
mode = "restrictive"
files.required = ["Cargo.toml", "src/lib.rs", "src/config.rs", "src/rule/mod.rs"]
directories.allowed = [{ target = "tests", description = "Crate integration tests." }]

[[rules.layout]]
target = "{linter,linter-*}/src/rule/*"
mode = "restrictive"
files.required = ["mod.rs", "config.rs", "readme.md"]
files.allowed = [
    { target = "*.rs", description = "Rule implementation modules." },
    { target = "license.txt", description = "Attribution for migrated dependencies or data." },
]
files.allow_empty = false
directories.allow_empty = false
directories.allowed = [{ target = "fixtures", description = "Rule test inputs." }]

[[rules.layout]]
target = "configs"
mode = "restrictive"
files.allowed = [{ target = "*.toml", description = "Embedded project configuration presets." }]

[[rules.layout]]
target = "docs"
mode = "restrictive"
files.allowed = [{ target = "*.md", description = "Project goal and rule descriptions." }]

[[rules.layout]]
target = "**/src{,/**}"
directories.allow_single_file = false

[[rules.layout]]
target = ["**/*.md", "**/*.markdown"]
allow = false
case_sensitive = false

[[rules.layout]]
target = ["docs/*.md"]
allow = true
description = "Documents the project goal and design."

[[rules.layout]]
target = ["{linter,linter-*}/src/rule/*/readme.md"]
allow = true
description = "Describes each rule and its configuration."

[[rules."rust/layers"]]
name = "linter"
target = ["linter"]
dependencies = []

[[rules."rust/layers"]]
name = "rust"
target = ["linter-rust"]
dependencies = ["linter"]

[[rules."rust/layers"]]
name = "c"
target = ["linter-c"]
dependencies = ["linter"]

[[rules."rust/layers"]]
name = "apps"
target = ["apps/*"]
dependencies = ["linter", "rust", "c", "markdown"]

[[rules.layout]]
target = [
    "**/{test,tests}.rs",
    "**/*{_,.,-}{test,tests}.rs",
    "**/{test,tests}{_,.,-}*.rs",
    "**/{test,tests}/**/*.rs",
]
allow = false
case_sensitive = false

[[rules.layout]]
target = ["**/*{Test,Tests}.rs"]
allow = false

[[rules.layout]]
target = ["tests/**/*.rs", "{linter,linter-*,apps/*}/tests/**/*.rs"]
allow = true
description = "Crate integration tests and repository-wide test cases."

[[rules."rust/file-length"]]
target = "**/*.rs"
max_lines = 500

[[rules.filename]]
target = "{linter,linter-*}/src/rule/*/*"
kind = "file"
case = "snake_case"

[[rules.filename]]
target = "{linter,linter-*}/src/rule/*/*"
kind = "directory"
case = "snake_case"

[[rules.filename]]
target = "**/src{,/**}/*"
kind = "file"
max_words = 2

[[rules.filename]]
target = "**/src/**/*"
kind = "directory"
max_words = 2

[[rules."shared-affix"]]
target = "**/src{,/**}/*"
max_prefix = 2
max_suffix = 2

[[rules."forbidden-words"]]
target = "**/src/**"
words = ["common", "core", "helper", "helpers", "misc", "shared", "util", "utils", "selected", "prepared", "creating", "loading", "running", "handling", "validating", "decoding", "encoding", "dispatching", "executing"]

[[rules."redundant-parent-name"]]
target = "**/src/**/*.{rs,c,h}"
ignored_names = ["mod", "lib", "main", "index"]

[[rules."line-width"]]
target = "**/*.{rs,c,h}"
max_columns = 100
tab_width = 4

[[rules."max-indent"]]
target = "**/*.{rs,c,h}"
max_columns = 16
tab_width = 4

[[rules."rust/function-length"]]
target = "**/*.rs"
max_lines = 50

[[rules."rust/method-length"]]
target = "**/*.rs"
max_lines = 50

[[rules."rust/nesting"]]
target = "**/*.rs"
max_depth = 2
ignore_guard_clauses = true

[[rules."rust/struct-noun-naming"]]
target = "**/*.rs"

[[rules."rust/duplicate-entity-base"]]
target = "**/*.rs"
min_shared_fields = 3

[[rules."rust/wire-domain-model-duplication"]]
target = "**/*.rs"
min_shared_fields = 3
min_overlap_percent = 75

[[rules."rust/boolean-state-cluster"]]
target = "**/*.rs"
min_fields = 3

[[rules."rust/string-backed-finite-state"]]
target = "**/*.rs"
min_variants = 3

[[rules."rust/trait-method-count"]]
target = "**/*.rs"
max_methods = 3

[[rules."rust/struct-word-count"]]
target = "**/*.rs"
max_words = 2

[[rules."rust/empty-struct"]]
target = "**/*.rs"

[[rules."rust/layers"]]
name = "markdown"
target = "linter-markdown"
dependencies = ["linter"]

[[rules."rust/module-name"]]
target = "**/*.rs"
forbidden_words = ["common", "core", "helper", "helpers", "misc", "shared", "util", "utils"]

[[rules."markdown/examples"]]
target = "**/*.md"
min_cases = 0

[[rules."rust/path-module-flattening"]]
target = "**/*.rs"
max_child_domains = 1

[[rules."rust/receiver-name-repetition"]]
target = "**/*.rs"

[[rules."rust/broad-trait-responsibilities"]]
target = "**/*.rs"
min_methods = 8
min_clusters = 3
min_methods_per_cluster = 2
ignored_type_words = ["result", "option", "vec", "box", "arc", "dyn", "impl", "where", "send", "sync", "static", "error", "bool", "str", "string", "usize", "isize", "u8", "u16", "u32", "u64", "u128", "i8", "i16", "i32", "i64", "i128"]
cohesive_suffixes = ["Protocol", "Codec", "Visitor", "Renderer", "Commands"]
generated_markers = ["@generated", "automatically generated"]
generated_attributes = ["automatically_derived", "proc_macro_derive"]
capabilities = [
  { name = "persistence", verbs = ["create", "open", "read", "write", "save", "load", "delete", "remove", "list", "find", "get", "put"] },
  { name = "lifecycle", verbs = ["start", "stop", "pause", "resume", "restart", "kill", "launch", "terminate"] },
  { name = "observation", verbs = ["inspect", "status", "stats", "health", "metrics", "describe", "query"], nouns = ["metric", "metrics", "stat", "stats", "status", "health"] },
  { name = "configuration", verbs = ["configure", "set", "update", "apply", "reset", "enable", "disable"] },
  { name = "events", verbs = ["subscribe", "unsubscribe", "watch", "emit", "notify", "poll"], nouns = ["event", "events", "notification", "notifications"] },
  { name = "transfer", verbs = ["upload", "download", "push", "pull", "import", "export", "copy"] },
  { name = "authorization", verbs = ["login", "logout", "authenticate", "authorize", "grant", "revoke"], nouns = ["auth", "permission", "permissions", "credential", "credentials"] },
  { name = "connection", verbs = ["connect", "disconnect", "bind", "listen", "accept", "send", "receive"] },
  { name = "rendering", verbs = ["render", "draw", "present", "commit", "frame", "paint"] },
  { name = "traversal", verbs = ["visit", "walk", "fold", "traverse"] },
  { name = "codec", verbs = ["encode", "decode", "serialize", "deserialize", "parse", "format"] },
  { name = "clipboard", nouns = ["clipboard"] },
  { name = "window", nouns = ["window", "windows", "surface", "interaction"] },
]

[[rules."rust/self-constructor-static"]]
target = "**/*.rs"

[[rules."rust/redundant-module-prefix"]]
target = "**/*.rs"

[[rules."rust/god-object-growth"]]
target = "**/*.rs"
unwrap_types = ["std:Box", "std:Option", "std:Arc", "std:Rc", "std:Mutex", "std:RwLock", "std:RefCell", "std:SyncWeak", "std:RcWeak"]
excluded_suffixes = ["Builder"]

[[rules."rust/detached-constructor"]]
target = "**/*.rs"

[[rules."rust/redundant-accessor"]]
target = "**/*.rs"

[[rules."rust/unsafe-boundary"]]
target = "**/*.rs"

[[rules."rust/free-function"]]
target = "**/*.rs"
mode = "receiver"
boundary_derives = ["clap::Parser", "clap::Args", "Parser", "Args"]
